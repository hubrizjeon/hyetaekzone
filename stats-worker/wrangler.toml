# 혜택존 방문·클릭 집계 (개인정보 없이 날짜별 개수만) + 쿠팡 상품 검색 (/search)
# 배포: cd stats-worker && <wrangler> deploy        조회: scripts/stats.sh
name = "hyetaekzone-stats"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "hyetaekzone-stats"
database_id = "88642c4a-b3c4-4a39-9deb-3f58e9fa0b04"

# 회원·포인트 (카카오 로그인). 개인정보는 여기만 — 방문 집계 DB와 분리
[[d1_databases]]
binding = "MEM"
database_name = "hyetaekzone-members"
database_id = "b2a83c4e-f5e8-4041-8571-038cf60968b9"

[vars]
SITE_URL = "https://hubrizjeon.github.io/hyetaekzone/"

# 매시 5분 — 쿠팡 리포트는 하루 한 번(보통 다음 날 12~16시) 올라오므로, 올라오면 1시간 안에 회원 화면에 반영
[triggers]
crons = ["5 * * * *"]
